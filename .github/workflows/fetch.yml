name: Fetch Data
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch Game Data
        run: |
          curl -s "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json" -o data.json
          
      - name: Commit and Push
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@bot.com"
          git add data.json
          git commit -m "Update Data" || exit 0
          git push
          # update
